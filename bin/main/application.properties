spring.application.name=vastravibe


spring.datasource.url=jdbc:postgresql://localhost:5432/vastravibe_db
spring.datasource.username=postgres
spring.datasource.password=rodbez

# Hibernate automatically creates/updates tables based on entities
spring.jpa.hibernate.ddl-auto=update


# Show SQL queries in console
spring.jpa.show-sql=true


spring.redis.redis.host=localhost
spring.redis.redis.port=6379
spring.session.store-type=redis

logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security=TRACE

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}